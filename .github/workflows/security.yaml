name: Security

# 安全门禁：由 ci.yaml 编排调用，执行密钥泄露扫描、依赖合规审计与 CodeQL 分析

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # 密钥泄露扫描
  gitleaks:
    name: 密钥泄露扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 安装 Gitleaks 官方原生 CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo gitleaks/gitleaks --pattern '*_linux_x64.tar.gz' --output - | sudo tar -xz -C /usr/local/bin gitleaks
      - name: 执行全量 Git 历史与存量密钥扫描
        run: gitleaks git --verbose --redact .

  # 依赖漏洞（RustSec）与许可证合规检查
  cargo-deny:
    name: 依赖与合规审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: 执行依赖安全审计
        run: cargo deny check

  # CodeQL 静态安全分析
  codeql:
    name: CodeQL 静态分析
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:rust"
