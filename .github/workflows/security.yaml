name: Security

# 安全门禁：由 ci.yaml 编排调用，执行密钥泄露扫描与 RustSec 依赖漏洞合规审计

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # 密钥泄露扫描
  gitleaks:
    name: 密钥泄露扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 安装 Gitleaks 官方原生 CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo gitleaks/gitleaks --pattern '*_linux_x64.tar.gz' --output - | sudo tar -xz -C /usr/local/bin gitleaks
      - name: 执行全量 Git 历史与存量密钥扫描
        run: gitleaks git --verbose --redact .

  # 依赖漏洞（RustSec）与许可证合规检查
  cargo-deny:
    name: 依赖与合规审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: just, cargo-deny
      - name: 执行依赖安全审计
        run: just audit
