[workspace]
resolver = "3"
members = [
    "server/shared_kernel",
    "server/app",
]
default-members = [
    "server/shared_kernel",
    "server/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/0xTimi2233/ai-router"

[workspace.dependencies]
shared-kernel = { path = "server/shared_kernel", version = "=0.1.0" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unwrap_in_result = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto = "thin"
